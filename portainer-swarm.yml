version: "3.8"
# Homepage Studio: Portainer / Docker Swarm stack.
#
# Paste this whole file into Portainer's stack web editor unchanged. Everything
# you set lives in the stack's environment variables: start from
# portainer.env.example. Before you deploy, create the shared proxy network and
# the four Docker secrets below (docs/DEPLOY.md, steps 2 and 5).
#
# Keep required-variable messages free of hyphens: Docker's legacy stack parser
# checks default operators before required operators, including message text.

secrets:
  # Long random text that encrypts authenticator secrets and single sign-on
  # tokens. Keep a copy: changing it means everyone sets up their authenticator
  # app again.
  studio_auth_key:
    external: true
  # The client secret from your OpenID Connect identity provider, or
  # the word off while you don't use single sign-on.
  studio_oidc_client_secret:
    external: true
  # The mail server password, or the word off while you don't use email.
  studio_smtp_password:
    external: true
  # The first administrator's password, read once on the first start with
  # STUDIO_ADMIN_USERNAME, or the word off to create the administrator in the
  # browser instead.
  studio_admin_password:
    external: true

services:
  studio:
    image: ${STUDIO_IMAGE:?Set STUDIO_IMAGE to the qualified application image digest}
    secrets:
      - studio_auth_key
      - studio_oidc_client_secret
      - studio_smtp_password
      - studio_admin_password
    environment:
      STUDIO_PUBLIC_ORIGIN: ${STUDIO_PUBLIC_ORIGIN:?Set the exact dashboard URL origin}
      STUDIO_BACKUP_RETENTION: ${STUDIO_BACKUP_RETENTION:-25}
      STUDIO_RENDERER_MAX_WORKERS: ${STUDIO_RENDERER_MAX_WORKERS:-8}
      STUDIO_RENDERER_IDLE_SECONDS: ${STUDIO_RENDERER_IDLE_SECONDS:-600}
      STUDIO_RENDERER_STARTUP_SECONDS: ${STUDIO_RENDERER_STARTUP_SECONDS:-30}
      STUDIO_FRAME_ANCESTORS: ${STUDIO_FRAME_ANCESTORS:-}
      # Studio sign-in (docs/AUTHENTICATION.md). On by default; it needs an
      # https:// STUDIO_PUBLIC_ORIGIN. Set off only if another layer controls access.
      # Empty optional values use Studio's defaults (portainer.env.example).
      STUDIO_AUTH: ${STUDIO_AUTH:-on}
      STUDIO_TRUSTED_PROXIES: ${STUDIO_TRUSTED_PROXIES:-}
      # The secrets above, read from the files Swarm mounts.
      STUDIO_AUTH_KEY_FILE: /run/secrets/studio_auth_key
      STUDIO_OIDC_CLIENT_SECRET_FILE: /run/secrets/studio_oidc_client_secret
      STUDIO_SMTP_PASSWORD_FILE: /run/secrets/studio_smtp_password
      STUDIO_ADMIN_PASSWORD_FILE: /run/secrets/studio_admin_password
      # The first administrator, created once on the first start with the
      # studio_admin_password secret (docs/AUTHENTICATION.md). Ignored as soon
      # as Studio has any account.
      STUDIO_ADMIN_USERNAME: ${STUDIO_ADMIN_USERNAME:-}
      STUDIO_ADMIN_EMAIL: ${STUDIO_ADMIN_EMAIL:-}
      # Optional single sign-on with an identity provider (docs/IDP-OTHERS.md;
      # Authentik example: docs/IDP-AUTHENTIK.md). Issuer and client ID
      # turn it on; the client secret is the studio_oidc_client_secret secret.
      STUDIO_OIDC_ISSUER: ${STUDIO_OIDC_ISSUER:-}
      STUDIO_OIDC_CLIENT_ID: ${STUDIO_OIDC_CLIENT_ID:-}
      STUDIO_OIDC_NAME: ${STUDIO_OIDC_NAME:-}
      STUDIO_OIDC_SCOPES: ${STUDIO_OIDC_SCOPES:-}
      STUDIO_OIDC_GROUPS_CLAIM: ${STUDIO_OIDC_GROUPS_CLAIM:-}
      STUDIO_OIDC_REFRESH_MINUTES: ${STUDIO_OIDC_REFRESH_MINUTES:-}
      # Provider groups that make administrators and that may sign in. Set
      # here, they can't be changed in Studio.
      STUDIO_OIDC_ADMIN_GROUPS: ${STUDIO_OIDC_ADMIN_GROUPS:-}
      STUDIO_OIDC_ALLOWED_GROUPS: ${STUDIO_OIDC_ALLOWED_GROUPS:-}
      # Testing only: true accepts a plain http issuer.
      STUDIO_OIDC_ALLOW_HTTP: ${STUDIO_OIDC_ALLOW_HTTP:-}
      # Optional email for invitations, password resets and security alerts.
      # The password is the studio_smtp_password secret.
      STUDIO_SMTP_HOST: ${STUDIO_SMTP_HOST:-}
      STUDIO_SMTP_PORT: ${STUDIO_SMTP_PORT:-}
      STUDIO_SMTP_SECURE: ${STUDIO_SMTP_SECURE:-}
      STUDIO_SMTP_USER: ${STUDIO_SMTP_USER:-}
      STUDIO_SMTP_FROM_ADDRESS: ${STUDIO_SMTP_FROM_ADDRESS:-}
      STUDIO_SMTP_FROM_NAME: ${STUDIO_SMTP_FROM_NAME:-}
      # Older single setting (an address, or "Name <address>"); use the two above instead.
      STUDIO_SMTP_FROM: ${STUDIO_SMTP_FROM:-}
      LOG_TARGETS: stdout
    # No published port: the reverse proxy reaches Studio as
    # <stack name>_studio:3000 on the shared network (docs/DEPLOY.md, step 8).
    networks:
      - proxy
    # Named volumes by default. Set STUDIO_CONFIG_PATH and STUDIO_STATE_PATH to
    # absolute host directories owned by UID/GID 1000 to bind mount instead.
    volumes:
      - ${STUDIO_CONFIG_PATH:-config}:/app/config
      - ${STUDIO_STATE_PATH:-state}:/app/state
    stop_grace_period: 30s
    # A minimal init (docker-init) is PID 1 and reaps orphaned processes.
    init: true
    # The application runs as UID 1000 and needs no Linux capabilities.
    # docker stack deploy honors cap_drop (Docker 20.10 or later) but ignores
    # security_opt, so no-new-privileges cannot be set from a Swarm stack; the
    # image carries no setuid or file-capability binaries instead.
    cap_drop:
      - ALL
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == ${STUDIO_NODE:?Set the exact Swarm node hostname that owns the persistent volumes}
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: rollback
        monitor: 180s
      rollback_config:
        parallelism: 1
        order: stop-first
        monitor: 180s
      restart_policy:
        condition: any
        delay: 5s

networks:
  # The overlay network Studio shares with your reverse proxy. Create it once
  # before deploying (docs/DEPLOY.md, step 2); the stack only joins it.
  proxy:
    external: true
    name: ${STUDIO_NETWORK_NAME:-homepage-studio}

volumes:
  config:
  state:
