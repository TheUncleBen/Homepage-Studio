version: "3.8"
# Keep required-variable messages free of hyphens: Docker's legacy stack parser
# checks default operators before required operators, including message text.
services:
  studio:
    image: ${STUDIO_IMAGE:?Set STUDIO_IMAGE to the qualified application image digest}
    environment:
      STUDIO_PUBLIC_ORIGIN: ${STUDIO_PUBLIC_ORIGIN:?Set the exact dashboard URL origin}
      STUDIO_BACKUP_RETENTION: ${STUDIO_BACKUP_RETENTION:-25}
      STUDIO_RENDERER_MAX_WORKERS: ${STUDIO_RENDERER_MAX_WORKERS:-8}
      STUDIO_RENDERER_IDLE_SECONDS: ${STUDIO_RENDERER_IDLE_SECONDS:-600}
      STUDIO_RENDERER_STARTUP_SECONDS: ${STUDIO_RENDERER_STARTUP_SECONDS:-30}
      STUDIO_FRAME_ANCESTORS: ${STUDIO_FRAME_ANCESTORS:-}
      # Studio sign-in (docs/AUTHENTICATION.md). On by default; it needs an
      # https:// STUDIO_PUBLIC_ORIGIN. Set off only if another layer controls access.
      # Empty optional values use Studio's defaults (portainer.env.example).
      STUDIO_AUTH: ${STUDIO_AUTH:-on}
      STUDIO_AUTH_KEY: ${STUDIO_AUTH_KEY:-}
      STUDIO_AUTH_KEY_FILE: ${STUDIO_AUTH_KEY_FILE:-}
      STUDIO_TRUSTED_PROXIES: ${STUDIO_TRUSTED_PROXIES:-}
      # Single sign-on: issuer, client ID and client secret go together.
      STUDIO_OIDC_ISSUER: ${STUDIO_OIDC_ISSUER:-}
      STUDIO_OIDC_CLIENT_ID: ${STUDIO_OIDC_CLIENT_ID:-}
      STUDIO_OIDC_CLIENT_SECRET: ${STUDIO_OIDC_CLIENT_SECRET:-}
      STUDIO_OIDC_CLIENT_SECRET_FILE: ${STUDIO_OIDC_CLIENT_SECRET_FILE:-}
      STUDIO_OIDC_NAME: ${STUDIO_OIDC_NAME:-}
      STUDIO_OIDC_SCOPES: ${STUDIO_OIDC_SCOPES:-}
      STUDIO_OIDC_GROUPS_CLAIM: ${STUDIO_OIDC_GROUPS_CLAIM:-}
      STUDIO_OIDC_REFRESH_MINUTES: ${STUDIO_OIDC_REFRESH_MINUTES:-}
      # Testing only: true accepts a plain http issuer.
      STUDIO_OIDC_ALLOW_HTTP: ${STUDIO_OIDC_ALLOW_HTTP:-}
      # Optional email for invitations, password resets and security alerts.
      STUDIO_SMTP_HOST: ${STUDIO_SMTP_HOST:-}
      STUDIO_SMTP_PORT: ${STUDIO_SMTP_PORT:-}
      STUDIO_SMTP_SECURE: ${STUDIO_SMTP_SECURE:-}
      STUDIO_SMTP_USER: ${STUDIO_SMTP_USER:-}
      STUDIO_SMTP_PASSWORD: ${STUDIO_SMTP_PASSWORD:-}
      STUDIO_SMTP_PASSWORD_FILE: ${STUDIO_SMTP_PASSWORD_FILE:-}
      STUDIO_SMTP_FROM: ${STUDIO_SMTP_FROM:-}
      LOG_TARGETS: stdout
    # Host-mode publication listens on every interface of the selected node.
    # Swarm cannot bind a single address; restrict access with a host firewall.
    # A proxy on a shared Docker network needs no published port: see
    # docs/REVERSE-PROXY.md (Proxy on a Docker network).
    ports:
      - target: 3000
        published: ${STUDIO_PORT:-3000}
        protocol: tcp
        mode: host
    # Named volumes by default. Set STUDIO_CONFIG_PATH and STUDIO_STATE_PATH to
    # absolute host directories owned by UID/GID 1000 to bind mount instead.
    volumes:
      - ${STUDIO_CONFIG_PATH:-config}:/app/config
      - ${STUDIO_STATE_PATH:-state}:/app/state
    stop_grace_period: 30s
    # A minimal init (docker-init) is PID 1 and reaps orphaned processes.
    init: true
    # The application runs as UID 1000 and needs no Linux capabilities.
    # docker stack deploy honors cap_drop (Docker 20.10 or later) but ignores
    # security_opt, so no-new-privileges cannot be set from a Swarm stack; the
    # image carries no setuid or file-capability binaries instead.
    cap_drop:
      - ALL
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == ${STUDIO_NODE:?Set the exact Swarm node hostname that owns the persistent volumes}
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: rollback
        monitor: 180s
      rollback_config:
        parallelism: 1
        order: stop-first
        monitor: 180s
      restart_policy:
        condition: any
        delay: 5s
volumes:
  config:
  state:
