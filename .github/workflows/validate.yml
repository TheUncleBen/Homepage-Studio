name: Validate without publication

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  # Architecture-independent native source gates run once, natively on
  # amd64, and every architecture image build needs them. The Dockerfile
  # itself only installs, builds and compresses.
  native-checks:
    name: Native source checks (audit, lint, unit tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      LOG_TARGETS: stdout
    steps:
      - name: Check out this exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Install the verified pinned pnpm and the frozen native lockfile
        run: |
          node scripts/install-pinned-pnpm.mjs upstream.lock.json
          pnpm --dir homepage install --frozen-lockfile
      - name: Check the native redirect security fix
        run: STUDIO_NATIVE_SOURCE=homepage node --test test/native-redirect-security.mjs
      - name: Audit locked production native dependencies
        working-directory: homepage
        run: pnpm audit --prod
      - name: Lint the complete native source
        working-directory: homepage
        run: pnpm lint
      - name: Run the complete native unit test suite
        working-directory: homepage
        run: pnpm test
      - name: Verify the Firefox and WebKit acceptance selection
        env:
          STUDIO_REQUIRE_PLAYWRIGHT_LIST: "1"
        run: |
          npm ci --prefix browser --ignore-scripts
          node --test test/cross-engine-selection.test.mjs

  qualify:
    needs: native-checks
    name: Native build and deployment (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    steps:
      - name: Check out this exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Record qualification environment
        run: |
          node --version
          npm --version
          python3 --version
          docker version
          docker compose version
          docker buildx version
      - name: Install locked controller dependencies
        run: npm ci --ignore-scripts
      - name: Verify controller and packaging behavior
        run: |
          npm audit --omit=dev
          npm test
          node --test test/*.test.mjs
          python3 -m unittest discover -s test -p 'test_*.py'
          node --test test/swarm-parser.mjs
          python3 scripts/pack-candidate-source.py --source . --commit "$GITHUB_SHA" --check
      - name: Build and load the complete application locally
        run: docker build --progress=plain --build-arg STUDIO_BUILD_REVISION="$GITHUB_SHA" --tag homepage-studio-ci:application --file Dockerfile .
      - name: Install locked browser test dependencies
        run: npm ci --prefix browser --ignore-scripts
      - name: Install all three browser engines in the disposable test runner
        run: node browser/node_modules/@playwright/test/cli.js install --with-deps chromium firefox webkit
      - name: Exercise fresh Compose and Swarm deployments
        env:
          STUDIO_TEST_CONTAINERS: "1"
          STUDIO_BROWSER_TESTS: "1"
          STUDIO_IMAGE: homepage-studio-ci:application
          STUDIO_EXPECTED_REVISION: ${{ github.sha }}
        run: node scripts/container-acceptance.mjs
      - name: Qualify both templates through pinned Portainer CE
        env:
          STUDIO_TEST_CONTAINERS: "1"
          STUDIO_PORTAINER_TESTS: "1"
          STUDIO_IMAGE: homepage-studio-ci:application
          STUDIO_EXPECTED_REVISION: ${{ github.sha }}
        run: node scripts/portainer-acceptance.mjs
      - name: Record qualification scope
        if: success()
        run: |
          printf '%s\n' '### Container qualification passed' 'Source: `'$GITHUB_SHA'`' 'Architecture: `${{ matrix.arch }}`' 'Tests built and ran the single local application image, fresh volumes, edits, snapshots, restarts, container replacement, standalone Compose, a one-node Swarm, three browser engines, real hidden-document timing, and both templates through pinned Portainer CE.' 'The disposable Portainer fixture transferred this same image through a temporary loopback registry only. No public registry login, public image push, release, date tag, or image artifact upload was performed.' >> "$GITHUB_STEP_SUMMARY"
