name: Validate without publication

on:
  push:
    branches:
      - implementation/native-dashboard
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Native build and deployment (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    steps:
      - name: Check out this exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Record qualification environment
        run: |
          node --version
          npm --version
          python3 --version
          docker version
          docker compose version
          docker buildx version
      - name: Install locked writer dependencies
        run: npm ci --ignore-scripts
      - name: Verify writer and packaging behavior
        run: |
          npm audit --omit=dev
          npm test
          node --test test/*.test.mjs
          python3 -m unittest discover -s test -p 'test_*.py'
          node --test test/swarm-parser.mjs
      - name: Verify and prepare the pinned native source
        run: python3 scripts/prepare-homepage.py
      - name: Build and load configuration service locally
        run: docker build --progress=plain --build-arg STUDIO_BUILD_REVISION="$GITHUB_SHA" --tag homepage-studio-ci:writer --file Dockerfile .
      - name: Test, build and load native renderer locally
        run: docker build --progress=plain --build-arg STUDIO_BUILD_REVISION="$GITHUB_SHA" --tag homepage-studio-ci:renderer --file Dockerfile.homepage .
      - name: Install locked browser test dependencies
        run: npm ci --prefix browser --ignore-scripts
      - name: Install all three browser engines in the disposable test runner
        run: node browser/node_modules/@playwright/test/cli.js install --with-deps chromium firefox webkit
      - name: Exercise fresh Compose and Swarm deployments
        env:
          STUDIO_TEST_CONTAINERS: "1"
          STUDIO_BROWSER_TESTS: "1"
          STUDIO_IMAGE: homepage-studio-ci:writer
          HOMEPAGE_IMAGE: homepage-studio-ci:renderer
          STUDIO_EXPECTED_REVISION: ${{ github.sha }}
        run: node scripts/container-acceptance.mjs
      - name: Qualify both templates through pinned Portainer CE
        env:
          STUDIO_TEST_CONTAINERS: "1"
          STUDIO_PORTAINER_TESTS: "1"
          STUDIO_IMAGE: homepage-studio-ci:writer
          HOMEPAGE_IMAGE: homepage-studio-ci:renderer
          STUDIO_EXPECTED_REVISION: ${{ github.sha }}
        run: node scripts/portainer-acceptance.mjs
      - name: Record qualification scope
        if: success()
        run: |
          printf '%s\n' '### Container qualification passed' 'Source: `'$GITHUB_SHA'`' 'Architecture: `${{ matrix.arch }}`' 'Tests built and ran both local images, fresh volumes, edits, snapshots, restarts, container replacement, standalone Compose, a one-node Swarm, three browser engines, real hidden-document timing, and both templates through pinned Portainer CE.' 'The disposable Portainer fixture transferred these same images through a temporary loopback registry only. No public registry login, public image push, release, date tag, or image artifact upload was performed.' >> "$GITHUB_STEP_SUMMARY"
