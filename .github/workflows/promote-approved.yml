# Official publication requires the exact owner-approved candidate and release.
# The .github/workflows definition and release/workflows copy must match.
name: Promote an exact owner-approved release

on:
  workflow_dispatch:
    inputs:
      candidate_manifest:
        description: Exact engineering-qualified candidate manifest JSON
        type: string
        required: true
      release_manifest:
        description: Exact accepted release manifest JSON, including Chicago date
        type: string
        required: true
      qualification_report:
        description: Exact bytes of the candidate verification.json
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: homepage-studio-official-publication
  cancel-in-progress: false

jobs:
  review:
    if: github.repository == 'TheUncleBen/Homepage-Studio' && github.actor == 'TheUncleBen' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      source_commit: ${{ steps.inputs.outputs.source_commit }}
      candidate_run_id: ${{ steps.inputs.outputs.candidate_run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Prepare the exact review statement
        id: inputs
        env:
          STUDIO_CANDIDATE_MANIFEST: ${{ inputs.candidate_manifest }}
          STUDIO_RELEASE_MANIFEST: ${{ inputs.release_manifest }}
          STUDIO_QUALIFICATION_REPORT: ${{ inputs.qualification_report }}
        run: node scripts/prepare-promotion-inputs.mjs review-inputs

  promote:
    needs: review
    environment:
      name: official-release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
      packages: write
    steps:
      - name: Check out the reviewed workflow tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          path: tools
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Recover the same dispatch data
        env:
          STUDIO_CANDIDATE_MANIFEST: ${{ inputs.candidate_manifest }}
          STUDIO_RELEASE_MANIFEST: ${{ inputs.release_manifest }}
          STUDIO_QUALIFICATION_REPORT: ${{ inputs.qualification_report }}
        run: node tools/scripts/prepare-promotion-inputs.mjs accepted-inputs
      - name: Authenticate actual owner approval before any source preparation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/scripts/release-guard.mjs accepted-inputs/candidate-manifest.json accepted-inputs/release-manifest.json
      - name: Retrieve the immutable bundle produced by the exact candidate run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: TheUncleBen/Homepage-Studio
          run-id: ${{ needs.review.outputs.candidate_run_id }}
          name: candidate-${{ needs.review.outputs.source_commit }}-${{ needs.review.outputs.candidate_run_id }}
          path: candidate-inputs
          digest-mismatch: error
      - name: Check out only the accepted source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.review.outputs.source_commit }}
          persist-credentials: false
          path: accepted-source
      - name: Promote identical images and publish verified assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/scripts/promote-release.mjs accepted-inputs/candidate-manifest.json accepted-inputs/release-manifest.json candidate-inputs accepted-source official-output
