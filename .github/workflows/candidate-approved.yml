# Dormant proposal. No GitHub Actions discovery occurs in release/workflows/.
# Requires approved PRIVATE staging. Explicit first-use bootstrap creates only
# qualified application images in verified private packages, never placeholders.
# Public distribution waits for exact owner approval; visibility is never changed.
name: Qualify and deliver one approved candidate

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact frozen default-branch commit to build and qualify
        type: string
        required: true
      bootstrap_private_packages:
        description: Authorize first-use private creation of the two declared staging and two intended destination packages from qualified images
        type: boolean
        required: true
        default: false

permissions:
  contents: read

env:
  STUDIO_CANDIDATE_SOURCE: ${{ inputs.source_commit }}
  STUDIO_PRIVATE_BOOTSTRAP: ${{ inputs.bootstrap_private_packages }}

concurrency:
  group: homepage-studio-candidate-publication
  cancel-in-progress: false

jobs:
  authorize:
    if: github.repository == 'TheUncleBen/Homepage-Studio' && github.actor == 'TheUncleBen' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.run_attempt == 1
    permissions:
      actions: read
      contents: read
      packages: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Verify actual package visibility and explicit bootstrap eligibility
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STUDIO_PACKAGE_METADATA_TOKEN: ${{ secrets.STUDIO_PACKAGE_METADATA_TOKEN }}
        run: node scripts/candidate-pipeline.mjs authorize
      - name: Record the exact private operation authorized by owner dispatch
        run: node scripts/candidate-pipeline.mjs review

  native:
    needs: authorize
    name: Native candidate qualification (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Validate locked source and writer behavior
        run: |
          npm ci --ignore-scripts
          npm audit --omit=dev
          npm test
          node --test test/*.test.mjs
          python3 -m unittest discover -s test -p 'test_*.py'
          node --test test/swarm-parser.mjs
          python3 scripts/prepare-homepage.py
      - name: Build the exact native architecture locally
        env:
          STUDIO_TARGET_PLATFORM: linux/${{ matrix.arch }}
        run: |
          docker buildx build --load --provenance=false --sbom=false --platform "$STUDIO_TARGET_PLATFORM" --build-arg STUDIO_BUILD_REVISION="$GITHUB_SHA" --tag homepage-studio-ci:writer --file Dockerfile .
          docker buildx build --load --provenance=false --sbom=false --platform "$STUDIO_TARGET_PLATFORM" --build-arg STUDIO_BUILD_REVISION="$GITHUB_SHA" --tag homepage-studio-ci:renderer --file Dockerfile.homepage .
      - name: Prepare the real production browser checks
        run: |
          npm ci --prefix browser --ignore-scripts
          node browser/node_modules/@playwright/test/cli.js install --with-deps chromium firefox webkit
      - name: Complete both-image Compose and Swarm acceptance before staging
        env:
          STUDIO_TEST_CONTAINERS: "1"
          STUDIO_BROWSER_TESTS: "1"
          STUDIO_IMAGE: homepage-studio-ci:writer
          HOMEPAGE_IMAGE: homepage-studio-ci:renderer
          STUDIO_EXPECTED_REVISION: ${{ github.sha }}
        run: node scripts/container-acceptance.mjs
      - name: Complete actual Portainer standalone and Swarm qualification
        env:
          STUDIO_TEST_CONTAINERS: "1"
          STUDIO_PORTAINER_TESTS: "1"
          STUDIO_IMAGE: homepage-studio-ci:writer
          HOMEPAGE_IMAGE: homepage-studio-ci:renderer
          STUDIO_EXPECTED_REVISION: ${{ github.sha }}
        run: node scripts/portainer-acceptance.mjs
      - name: Preserve only this natively tested image pair in verified private staging
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STUDIO_PACKAGE_METADATA_TOKEN: ${{ secrets.STUDIO_PACKAGE_METADATA_TOKEN }}
          STUDIO_TARGET_PLATFORM: linux/${{ matrix.arch }}
        run: node scripts/candidate-pipeline.mjs stage "$STUDIO_TARGET_PLATFORM"
      - name: Save noninstallable qualification metadata only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-target-${{ github.run_id }}-${{ matrix.arch }}
          path: candidate-targets/${{ matrix.arch }}.json
          if-no-files-found: error

  assemble:
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: candidate-target-${{ github.run_id }}-*
          merge-multiple: true
          path: candidate-targets
      - name: Preserve reproducible corresponding source and license files
        run: python3 scripts/pack-candidate-source.py --source . --commit "$GITHUB_SHA" --output candidate-inputs
      - name: Assemble the exact indexes and prepare any authorized private destinations
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STUDIO_PACKAGE_METADATA_TOKEN: ${{ secrets.STUDIO_PACKAGE_METADATA_TOKEN }}
        run: node scripts/candidate-pipeline.mjs assemble
      - name: Save source, evidence and pending templates; no image-layer artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-${{ github.sha }}-${{ github.run_id }}
          path: candidate-bundle/
          if-no-files-found: error

  publish:
    needs: assemble
    environment:
      name: candidate-publication
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: candidate-${{ github.sha }}-${{ github.run_id }}
          path: candidate-bundle
      - name: Authenticate exact approval, preserve existing build tags and verify anonymous pulls
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STUDIO_PACKAGE_METADATA_TOKEN: ${{ secrets.STUDIO_PACKAGE_METADATA_TOKEN }}
        run: node scripts/candidate-pipeline.mjs publish
