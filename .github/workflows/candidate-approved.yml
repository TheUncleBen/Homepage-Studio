# Default-branch pushes run full native qualification exactly once.
# Images are retained only for a deliberate [deliver-candidate] push or manual run.
# Official dated releases still require separate owner acceptance and promotion.
name: Validate and prepare deployment candidate

on:
  push:
    branches:
      - implementation/native-dashboard
  workflow_dispatch:

permissions:
  contents: read

env:
  STUDIO_CANDIDATE_SOURCE: ${{ github.sha }}

concurrency:
  group: homepage-studio-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Architecture-independent native source gates run once, natively on
  # amd64, and every architecture image build needs them. The Dockerfile
  # itself only installs, builds and compresses.
  native-checks:
    if: github.repository == 'TheUncleBen/Homepage-Studio' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    name: Native source checks (audit, lint, unit tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      LOG_TARGETS: stdout
    steps:
      - name: Check out this exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Install the verified pinned pnpm and the frozen native lockfile
        run: |
          node scripts/install-pinned-pnpm.mjs upstream.lock.json
          pnpm --dir homepage install --frozen-lockfile
      - name: Check the native redirect security fix
        run: STUDIO_NATIVE_SOURCE=homepage node --test test/native-redirect-security.mjs
      - name: Audit locked production native dependencies
        working-directory: homepage
        run: pnpm audit --prod
      - name: Lint the complete native source
        working-directory: homepage
        run: pnpm lint
      - name: Run the complete native unit test suite
        working-directory: homepage
        run: pnpm test
      - name: Verify the Firefox and WebKit acceptance selection
        env:
          STUDIO_REQUIRE_PLAYWRIGHT_LIST: "1"
        run: |
          npm ci --prefix browser --ignore-scripts
          node --test test/cross-engine-selection.test.mjs

  native:
    needs: native-checks
    if: github.repository == 'TheUncleBen/Homepage-Studio' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    name: Native build and deployment (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Validate locked source and controller behavior
        run: |
          npm ci --ignore-scripts
          npm audit --omit=dev
          npm test
          node --test test/*.test.mjs
          python3 -m unittest discover -s test -p 'test_*.py'
          node --test test/swarm-parser.mjs
          python3 scripts/pack-candidate-source.py --source . --commit "$GITHUB_SHA" --check
      - name: Build the exact native architecture locally
        env:
          STUDIO_TARGET_PLATFORM: linux/${{ matrix.arch }}
        run: |
          docker buildx build --load --provenance=false --sbom=false --platform "$STUDIO_TARGET_PLATFORM" --build-arg STUDIO_BUILD_REVISION="$GITHUB_SHA" --tag homepage-studio-ci:application --file Dockerfile .
      - name: Prepare the real production browser checks
        run: |
          npm ci --prefix browser --ignore-scripts
          node browser/node_modules/@playwright/test/cli.js install --with-deps chromium firefox webkit
      - name: Complete single-container Compose and Swarm acceptance
        env:
          STUDIO_TEST_CONTAINERS: "1"
          STUDIO_BROWSER_TESTS: "1"
          STUDIO_IMAGE: homepage-studio-ci:application
          STUDIO_EXPECTED_REVISION: ${{ github.sha }}
        run: node scripts/container-acceptance.mjs
      - name: Complete actual Portainer standalone and Swarm qualification
        env:
          STUDIO_TEST_CONTAINERS: "1"
          STUDIO_PORTAINER_TESTS: "1"
          STUDIO_IMAGE: homepage-studio-ci:application
          STUDIO_EXPECTED_REVISION: ${{ github.sha }}
        run: node scripts/portainer-acceptance.mjs
      - name: Retain this exact natively qualified application image when delivery is requested
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[deliver-candidate]')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STUDIO_TARGET_PLATFORM: linux/${{ matrix.arch }}
        run: node scripts/candidate-pipeline.mjs stage "$STUDIO_TARGET_PLATFORM"
      - name: Save this architecture’s qualified image receipt
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[deliver-candidate]')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-target-${{ github.run_id }}-${{ matrix.arch }}
          path: candidate-targets/${{ matrix.arch }}.json
          if-no-files-found: error

  assemble:
    needs: [native-checks, native]
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[deliver-candidate]')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: candidate-target-${{ github.run_id }}-*
          merge-multiple: true
          digest-mismatch: error
          path: candidate-targets
      - name: Preserve reproducible corresponding source and license files
        run: python3 scripts/pack-candidate-source.py --source . --commit "$GITHUB_SHA" --output candidate-inputs
      - name: Assemble and verify the exact deployable application image
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/candidate-pipeline.mjs assemble
      - name: Save digest-pinned Portainer templates, source and delivery evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-${{ github.sha }}-${{ github.run_id }}
          path: candidate-bundle/
          if-no-files-found: error
