services:
  studio:
    image: ${STUDIO_IMAGE:?Set STUDIO_IMAGE to the qualified application image digest}
    environment:
      STUDIO_PUBLIC_ORIGIN: ${STUDIO_PUBLIC_ORIGIN:?Set the exact dashboard URL origin}
      STUDIO_BACKUP_RETENTION: ${STUDIO_BACKUP_RETENTION:-25}
      STUDIO_RENDERER_MAX_WORKERS: ${STUDIO_RENDERER_MAX_WORKERS:-8}
      STUDIO_RENDERER_IDLE_SECONDS: ${STUDIO_RENDERER_IDLE_SECONDS:-600}
      STUDIO_RENDERER_STARTUP_SECONDS: ${STUDIO_RENDERER_STARTUP_SECONDS:-30}
      STUDIO_FRAME_ANCESTORS: ${STUDIO_FRAME_ANCESTORS:-}
      # Studio sign-in (docs/AUTHENTICATION.md). On by default; it needs an
      # https:// STUDIO_PUBLIC_ORIGIN. Set off only if another layer controls access.
      STUDIO_AUTH: ${STUDIO_AUTH:-on}
      STUDIO_AUTH_KEY: ${STUDIO_AUTH_KEY:-}
      STUDIO_TRUSTED_PROXIES: ${STUDIO_TRUSTED_PROXIES:-}
      STUDIO_OIDC_ISSUER: ${STUDIO_OIDC_ISSUER:-}
      STUDIO_OIDC_CLIENT_ID: ${STUDIO_OIDC_CLIENT_ID:-}
      STUDIO_OIDC_CLIENT_SECRET: ${STUDIO_OIDC_CLIENT_SECRET:-}
      STUDIO_OIDC_NAME: ${STUDIO_OIDC_NAME:-}
      STUDIO_SMTP_HOST: ${STUDIO_SMTP_HOST:-}
      STUDIO_SMTP_PORT: ${STUDIO_SMTP_PORT:-}
      STUDIO_SMTP_USER: ${STUDIO_SMTP_USER:-}
      STUDIO_SMTP_PASSWORD: ${STUDIO_SMTP_PASSWORD:-}
      STUDIO_SMTP_FROM: ${STUDIO_SMTP_FROM:-}
      LOG_TARGETS: stdout
    # Published on every host interface. To limit it to one address (for
    # example a reverse proxy on the same host), add host_ip: 127.0.0.1 here.
    ports:
      - target: 3000
        published: "${STUDIO_PORT:-3000}"
        protocol: tcp
    volumes:
      - config:/app/config
      - state:/app/state
    restart: unless-stopped
    # A minimal init (docker-init) is PID 1 and reaps orphaned processes.
    init: true
    # The application runs as UID 1000 and needs no Linux capabilities.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
volumes:
  config:
  state:
